<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — Minimalist Quotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">AURA</span>
        <span class="brand-tag">Port 5173</span>
      </div>

      <div class="header-actions">
        <button id="view-favorites-btn" class="icon-btn" title="View Saved Quotes" aria-label="Favorites">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="favorites-count" class="badge">0</span>
        </button>
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="sun-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Categories Filter Bar -->
    <nav class="categories-bar" id="categories-container" aria-label="Quote categories">
      <!-- Injected by JavaScript -->
    </nav>

    <!-- Main Quote Card Section -->
    <main class="main-content">
      <div class="quote-card-wrapper">
        <article class="quote-card" id="quote-card">
          <div class="card-top-meta">
            <span class="category-badge" id="quote-category">Philosophy</span>
            <span class="quote-counter" id="quote-index">#1</span>
          </div>

          <div class="quote-body">
            <div class="quote-mark-icon">“</div>
            <p class="quote-text" id="quote-text">Loading inspiration...</p>
          </div>

          <div class="quote-footer">
            <div class="author-details">
              <span class="author-name" id="quote-author">Author</span>
              <span class="author-bio" id="quote-bio">Thinker & Creator</span>
            </div>

            <div class="card-actions">
              <button id="favorite-btn" class="action-btn" title="Save to favorites" aria-label="Favorite quote">
                <svg id="fav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>

              <button id="copy-btn" class="action-btn" title="Copy to clipboard" aria-label="Copy quote">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </button>

              <button id="speech-btn" class="action-btn" title="Listen" aria-label="Read quote aloud">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
              </button>

              <button id="share-btn" class="action-btn" title="Share on X" aria-label="Share quote">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
              </button>
            </div>
          </div>
        </article>
      </div>

      <!-- Main Trigger Button -->
      <div class="controls-section">
        <button id="next-btn" class="primary-btn">
          <span>New Quote</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <p class="shortcut-hint">Tip: Press <kbd>Space</kbd> for next • <kbd>C</kbd> to copy</p>
      </div>
    </main>

    <!-- Modal for Saved Favorites -->
    <div id="favorites-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 id="modal-title">Saved Quotes</h2>
          <button id="close-modal-btn" class="icon-btn" aria-label="Close modal">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="favorites-list" class="modal-body">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
      <span id="toast-message">Quote copied to clipboard!</span>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Crafted with minimalism & care</span>
      <span class="footer-separator">•</span>
      <span class="port-indicator">Running on port 5173</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
